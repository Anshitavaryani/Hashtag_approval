# Puts the approval site live on every push to main: lint, type-check and build the
# static export, then upload out/ to the server and switch the site to it.
# Until the DEPLOY_ secrets are set, the deploy job passes without deploying.
# Settings, server setup and rolling back: README.md, "Deploying".
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# One deploy at a time, in push order. Of several pushes waiting, only the newest runs.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Compiled into the page, so not secret (see .env.example). For a subdomain,
          # set NEXT_PUBLIC_BASE_PATH to "" (README.md, "Serving it from a subdomain").
          NEXT_PUBLIC_API_URL: https://node.hashtagbillionaire.com/api/v1/
          NEXT_PUBLIC_BASE_PATH: /approval

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approval-out
          path: out/
          if-no-files-found: error
          retention-days: 7

  # A separate job, so the deploy key is never on a machine that ran npm install.
  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approval-out
          path: out

      # Without any DEPLOY_ secret it says so and passes; with only some it fails.
      - name: Upload and go live
        run: bash scripts/deploy.sh out
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          APPROVAL_URL: ${{ secrets.APPROVAL_URL }}
